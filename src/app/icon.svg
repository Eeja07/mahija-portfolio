<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Chassis for high visibility in both light & dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="#090d16" />
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- Network Circuit Grid Accents -->
  <line x1="2" y1="16" x2="6" y2="16" stroke="#475569" stroke-width="1.2" stroke-dasharray="1 1" />
  <line x1="26" y1="16" x2="30" y2="16" stroke="#475569" stroke-width="1.2" stroke-dasharray="1 1" />
  <line x1="16" y1="2" x2="16" y2="6" stroke="#475569" stroke-width="1.2" stroke-dasharray="1 1" />
  <line x1="16" y1="26" x2="16" y2="30" stroke="#475569" stroke-width="1.2" stroke-dasharray="1 1" />

  <!-- Primary Network Monogram 'M' Backbone -->
  <path
    d="M 7 24 L 7 8 L 16 16.5 L 25 8 L 25 24"
    fill="none"
    stroke="url(#monogramGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Network Node Terminals -->
  <circle cx="7" cy="24" r="1.8" fill="#00f0ff" />
  <circle cx="7" cy="8" r="1.8" fill="#38bdf8" />
  <circle cx="16" cy="16.5" r="2.2" fill="#ffffff" stroke="#3b82f6" stroke-width="0.8" />
  <circle cx="25" cy="8" r="1.8" fill="#38bdf8" />
  <circle cx="25" cy="24" r="1.8" fill="#10b981" />
</svg>
