<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f0ff" />
      <stop offset="50%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Chassis -->
  <rect width="32" height="32" rx="7" fill="#090d16" />
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="none" stroke="#1e293b" stroke-width="1" />
  
  <!-- Network Circuit Grid Accents -->
  <line x1="2" y1="16" x2="6" y2="16" stroke="#334155" stroke-width="1" stroke-dasharray="1 1" />
  <line x1="26" y1="16" x2="30" y2="16" stroke="#334155" stroke-width="1" stroke-dasharray="1 1" />
  <line x1="16" y1="2" x2="16" y2="6" stroke="#334155" stroke-width="1" stroke-dasharray="1 1" />
  <line x1="16" y1="26" x2="16" y2="30" stroke="#334155" stroke-width="1" stroke-dasharray="1 1" />

  <!-- Network Monogram M Conduit Path -->
  <path
    d="M 8 23 L 8 9 L 16 17 L 24 9 L 24 23"
    fill="none"
    stroke="url(#netGrad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Network Node Terminals -->
  <circle cx="8" cy="23" r="1.6" fill="#00f0ff" />
  <circle cx="8" cy="9" r="1.6" fill="#38bdf8" />
  <circle cx="16" cy="17" r="1.8" fill="#ffffff" stroke="#3b82f6" stroke-width="0.8" />
  <circle cx="24" cy="9" r="1.6" fill="#38bdf8" />
  <circle cx="24" cy="23" r="1.6" fill="#10b981" />
</svg>
