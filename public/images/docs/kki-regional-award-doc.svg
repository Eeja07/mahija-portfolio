      <g transform="translate(40, 272)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#06b6d4" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Contribution:</text>
