<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#09090b"/>
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Top Banner -->
  <rect x="40" y="32" width="720" height="74" rx="8" fill="#141417" stroke="#27272a" stroke-width="1" />
  <rect x="56" y="48" width="80" height="20" rx="4" fill="#8b5cf620" stroke="#8b5cf660" stroke-width="1" />
  <text x="96" y="62" fill="#8b5cf6" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">INFRA-MESH</text>
  
  <text x="150" y="64" fill="#fafafa" font-family="sans-serif" font-size="17" font-weight="700">Debian Homelab Cloud & Ingress Infrastructure</text>
  <text x="56" y="92" fill="#71717a" font-family="sans-serif" font-size="12">Multi-Service Container Mesh with Encrypted Egress Routing</text>

  <!-- Status LED -->
  <circle cx="732" cy="58" r="4" fill="#22c55e" />
  <text x="718" y="62" fill="#71717a" font-family="monospace" font-size="10" text-anchor="end">SYSTEM VERIFIED</text>

  <!-- Items -->
  
      <g transform="translate(40, 140)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#8b5cf6" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Host OS:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">Debian 12 Bookworm on Bare-Metal Hardware</text>
      </g>
    
      <g transform="translate(40, 184)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#8b5cf6" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Container Engine:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">Docker Compose with Isolated Bridge Networks</text>
      </g>
    
      <g transform="translate(40, 228)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#8b5cf6" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Egress Routing:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">Cloudflared Secure Tunnel (Zero Exposed Ports)</text>
      </g>
    
      <g transform="translate(40, 272)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#8b5cf6" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Storage Array:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">Automated Daily ZFS / Restic Offsite Backups</text>
      </g>
    
      <g transform="translate(40, 316)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#8b5cf6" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Monitoring Stack:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">Prometheus + Grafana + Node Exporter Dashboard</text>
      </g>
    

  <!-- Bottom Terminal Bar -->
  <rect x="40" y="390" width="720" height="32" rx="6" fill="#111113" stroke="#27272a" stroke-width="1" />
  <text x="56" y="410" fill="#52525b" font-family="monospace" font-size="11">eeja@portfolio:~$ telemetry --module infra-mesh --status ready --log 200_OK</text>
