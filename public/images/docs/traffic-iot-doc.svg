        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Microcontroller:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">ESP32 Dual-Core Node with WiFi & BLE Stack</text>
      </g>
    
      <g transform="translate(40, 184)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#eab308" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Flow Sensor:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">Ultrasonic / Optical Vehicle Counter Array</text>
      </g>
    
      <g transform="translate(40, 228)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
