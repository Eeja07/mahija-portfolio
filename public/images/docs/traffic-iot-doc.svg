<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#09090b"/>
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Top Banner -->
  <rect x="40" y="32" width="720" height="74" rx="8" fill="#141417" stroke="#27272a" stroke-width="1" />
  <rect x="56" y="48" width="80" height="20" rx="4" fill="#eab30820" stroke="#eab30860" stroke-width="1" />
  <text x="96" y="62" fill="#eab308" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">IOT-TELEMETRY</text>
  
  <text x="150" y="64" fill="#fafafa" font-family="sans-serif" font-size="17" font-weight="700">Smart Traffic Monitoring IoT Node</text>
  <text x="56" y="92" fill="#71717a" font-family="sans-serif" font-size="12">Edge Camera Vehicle Flow Estimation with MQTT Telemetry</text>

  <!-- Status LED -->
  <circle cx="732" cy="58" r="4" fill="#22c55e" />
  <text x="718" y="62" fill="#71717a" font-family="monospace" font-size="10" text-anchor="end">SYSTEM VERIFIED</text>

  <!-- Items -->
  
      <g transform="translate(40, 140)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
