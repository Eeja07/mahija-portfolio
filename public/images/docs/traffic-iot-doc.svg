        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Messaging Queue:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">MQTT Broker with TLS 1.3 Encryption</text>
      </g>
    
      <g transform="translate(40, 272)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#eab308" />
        <text x="36" y="22" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600">Time Series DB:</text>
        <text x="210" y="22" fill="#a1a1aa" font-family="monospace" font-size="12">InfluxDB Logging Peak Hour Density Metrics</text>
      </g>
    
      <g transform="translate(40, 316)">
        <rect width="720" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#eab308" />
